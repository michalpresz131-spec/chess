<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17211d">
    <title>Chess — Local two-player game</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game">
      <section class="game-layout" aria-label="Chess game">
        <button class="reset-button" id="reset-button" type="button">New game</button>
        <div class="board-wrap">
          <div class="board-player black" aria-live="polite">
            <span class="board-player-marker" aria-hidden="true"></span>
            <span id="black-board-name">Black</span>
            <span class="player-move-text" id="black-move-text">Waiting</span>
          </div>
          <div class="board" id="board" role="grid" aria-label="Chess board"></div>
          <div class="board-watermark" aria-hidden="true">Chess</div>
          <div class="board-player white" aria-live="polite">
            <span class="board-player-marker" aria-hidden="true"></span>
            <span id="white-board-name">White</span>
            <span class="player-move-text" id="white-move-text">White to move</span>
          </div>
        </div>
        <aside class="game-info">
          <section class="game-help" aria-label="Game help">
            <p class="hint">Select a piece, then choose a highlighted square.</p>
            <p class="coordinates">White at the bottom · Castling · En passant · Promotion</p>
          </section>
          <section class="leaderboard" aria-labelledby="leaderboard-title">
            <h2 id="leaderboard-title">Leaderboard</h2>
            <table>
              <thead>
                <tr>
                  <th scope="col">Player</th>
                  <th scope="col">Pts</th>
                  <th scope="col">W-D-L</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <th id="white-player-name" scope="row">White</th>
                  <td id="white-points">0</td>
                  <td id="white-record">0-0-0</td>
                </tr>
                <tr>
                  <th id="black-player-name" scope="row">Black</th>
                  <td id="black-points">0</td>
                  <td id="black-record">0-0-0</td>
                </tr>
              </tbody>
            </table>
            <p class="leaderboard-note">Wins earn 1 point; draws earn ½.</p>
          </section>
        </aside>
      </section>

      <div class="promotion-backdrop" id="promotion-backdrop" hidden>
        <section class="promotion-dialog" role="dialog" aria-modal="true" aria-labelledby="promotion-title">
          <h2 id="promotion-title">Promote pawn</h2>
          <p>Choose a piece for your pawn.</p>
          <div class="promotion-options" id="promotion-options"></div>
        </section>
      </div>
      <div class="promotion-backdrop" id="name-entry-backdrop" hidden>
        <form class="promotion-dialog name-entry-dialog" id="name-entry-form" role="dialog" aria-modal="true" aria-labelledby="name-entry-title">
          <h2 id="name-entry-title">White player</h2>
          <label class="name-entry-label" id="name-entry-label" for="name-entry-input">Enter White player's name</label>
          <input class="name-entry-input" id="name-entry-input" type="text" maxlength="20" autocomplete="off">
          <button class="reset-button" id="name-entry-submit" type="submit">Continue</button>
        </form>
      </div>
    </main>
  </body>
</html>
